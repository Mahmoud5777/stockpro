<section *hasPermission="'ADMIN_GROUPS:consultation'" class="group-list">
    <header>
        <h1>Groupes</h1>
        <input type="search" [(ngModel)]="search" (keyup.enter)="searchItems()" placeholder="Rechercher" />
    </header>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Code</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of (data$ | async)?.content">
                <td></td>
                <td>nom</td>
                <td>code</td>
                <td>description</td>
            </tr>
        </tbody>
    </table>
</section>
