<form [formGroup]="form" (ngSubmit)="submit()">
    <label for="codeRole">CodeRole</label>
    <input id="codeRole" formControlName="codeRole" />
    <small
        *ngIf="form.controls.codeRole.touched && form.controls.codeRole.hasError('required')">Le code rôle est obligatoire</small>
    <label for="libelle">Libelle</label>
    <input id="libelle" formControlName="libelle" />
    <small
        *ngIf="form.controls.libelle.touched && form.controls.libelle.hasError('required')">Le libellé est obligatoire</small>
    <label for="description">Description</label>
    <input id="description" formControlName="description" />
    <small
        *ngIf="form.controls.description.touched && form.controls.description.hasError('required')"></small>
    <button type="submit">Enregistrer</button>
</form>
