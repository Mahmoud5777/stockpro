<section *hasPermission="'ADMIN_ROLES:consultation'" class="role-list">
    <header>
        <h1>Rôles</h1>
        <input type="search" [(ngModel)]="search" (keyup.enter)="searchItems()" placeholder="Rechercher" />
    </header>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>CodeRole</th>
                <th>Libelle</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of (data$ | async)?.content">
                <td></td>
                <td>codeRole</td>
                <td>libelle</td>
                <td>description</td>
            </tr>
        </tbody>
    </table>
</section>
