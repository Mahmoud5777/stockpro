<section *hasPermission="'ADMIN_USER_SITE:consultation'" class="user-site-list">
    <header>
        <h1>User Sites</h1>
        <input type="search" [(ngModel)]="search" (keyup.enter)="searchItems()" placeholder="Rechercher" />
    </header>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>RoleUtilisateur</th>
                <th>DateAffectation</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of (data$ | async)?.content">
                <td></td>
                <td>roleUtilisateur</td>
                <td>dateAffectation</td>
            </tr>
        </tbody>
    </table>
</section>
