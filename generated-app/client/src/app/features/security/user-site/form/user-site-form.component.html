<form [formGroup]="form" (ngSubmit)="submit()">
    <label for="roleUtilisateur">RoleUtilisateur</label>
    <input id="roleUtilisateur" formControlName="roleUtilisateur" />
    <small
        *ngIf="form.controls.roleUtilisateur.touched && form.controls.roleUtilisateur.hasError('required')"></small>
    <label for="dateAffectation">DateAffectation</label>
    <input id="dateAffectation" formControlName="dateAffectation" />
    <small
        *ngIf="form.controls.dateAffectation.touched && form.controls.dateAffectation.hasError('required')"></small>
    <label for="userId">User</label>
    <input id="userId" formControlName="userId" />
    <label for="siteId">Site</label>
    <input id="siteId" formControlName="siteId" />
    <button type="submit">Enregistrer</button>
</form>
