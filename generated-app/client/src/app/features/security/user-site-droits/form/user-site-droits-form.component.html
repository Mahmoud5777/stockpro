<form [formGroup]="form" (ngSubmit)="submit()">
    <label for="codeDroit">CodeDroit</label>
    <input id="codeDroit" formControlName="codeDroit" />
    <small
        *ngIf="form.controls.codeDroit.touched && form.controls.codeDroit.hasError('required')">Le code droit est obligatoire</small>
    <label for="libelleDroit">LibelleDroit</label>
    <input id="libelleDroit" formControlName="libelleDroit" />
    <small
        *ngIf="form.controls.libelleDroit.touched && form.controls.libelleDroit.hasError('required')">Le libellé du droit est obligatoire</small>
    <label for="estExporte">EstExporte</label>
    <input id="estExporte" formControlName="estExporte" />
    <small
        *ngIf="form.controls.estExporte.touched && form.controls.estExporte.hasError('required')"></small>
    <label for="userSiteId">UserSite</label>
    <input id="userSiteId" formControlName="userSiteId" />
    <label for="roleId">Role</label>
    <input id="roleId" formControlName="roleId" />
    <button type="submit">Enregistrer</button>
</form>
