<section *hasPermission="'ADMIN_USER_SITE_DROITS:consultation'" class="user-site-droits-list">
    <header>
        <h1>User Site Droits</h1>
        <input type="search" [(ngModel)]="search" (keyup.enter)="searchItems()" placeholder="Rechercher" />
    </header>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>CodeDroit</th>
                <th>LibelleDroit</th>
                <th>EstExporte</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of (data$ | async)?.content">
                <td></td>
                <td>codeDroit</td>
                <td>libelleDroit</td>
                <td>estExporte</td>
            </tr>
        </tbody>
    </table>
</section>
