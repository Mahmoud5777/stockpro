<section *hasPermission="'ADMIN_USERS:consultation'" class="user-list">
    <header>
        <h1>Utilisateurs</h1>
        <input type="search" [(ngModel)]="search" (keyup.enter)="searchItems()" placeholder="Rechercher" />
    </header>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Password</th>
                <th>Prenom</th>
                <th>Nom</th>
                <th>EstActif</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of (data$ | async)?.content">
                <td></td>
                <td>username</td>
                <td>email</td>
                <td>password</td>
                <td>prenom</td>
                <td>nom</td>
                <td>estActif</td>
            </tr>
        </tbody>
    </table>
</section>
