<form [formGroup]="form" (ngSubmit)="submit()">
    <label for="username">Username</label>
    <input id="username" formControlName="username" />
    <small
        *ngIf="form.controls.username.touched && form.controls.username.hasError('required')">Le nom d'utilisateur est obligatoire</small>
    <label for="email">Email</label>
    <input id="email" formControlName="email" />
    <small
        *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">L'adresse email est obligatoire</small>
    <label for="password">Password</label>
    <input id="password" formControlName="password" />
    <small
        *ngIf="form.controls.password.touched && form.controls.password.hasError('required')">Le mot de passe est obligatoire</small>
    <label for="prenom">Prenom</label>
    <input id="prenom" formControlName="prenom" />
    <small
        *ngIf="form.controls.prenom.touched && form.controls.prenom.hasError('required')"></small>
    <label for="nom">Nom</label>
    <input id="nom" formControlName="nom" />
    <small
        *ngIf="form.controls.nom.touched && form.controls.nom.hasError('required')"></small>
    <label for="estActif">EstActif</label>
    <input id="estActif" formControlName="estActif" />
    <small
        *ngIf="form.controls.estActif.touched && form.controls.estActif.hasError('required')"></small>
    <label for="siteId">Site</label>
    <input id="siteId" formControlName="siteId" />
    <button type="submit">Enregistrer</button>
</form>
